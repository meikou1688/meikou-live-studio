name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MEIKOU_VERSION: 2.0.0-m2.${{ github.run_number }}
  MEIKOU_VIVERSION: 2.0.0.${{ github.run_number }}
  # OBS 核心版本寫在 obs-version.txt（自動更新流程會改它）

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: OBS version and changelog heading
        run: |
          $tag = (Get-Content obs-version.txt -Raw).Trim()
          "OBS_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/changelog.py stamp meikou/resources/CHANGELOG.md
      - name: Fetch OBS version tag (git describe needs it)
        run: git -C obs-studio fetch --depth=1 origin "refs/tags/${env:OBS_TAG}:refs/tags/${env:OBS_TAG}"

      - name: Restore OBS dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: obs-studio/.deps
          key: obs-deps-windows-x64-${{ hashFiles('obs-studio/CMakePresets.json') }}

      - name: Hook Meikou into the OBS build
        run: |
          $f = 'obs-studio/CMakeLists.txt'
          $c = Get-Content $f -Raw
          if ($c -notmatch 'meikou') {
            $line = 'add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/../meikou" meikou)'
            $c = $c.Replace('add_subdirectory(frontend)', "add_subdirectory(frontend)`n$line")
            Set-Content -Path $f -Value $c -NoNewline
          }
          Select-String -Path $f -Pattern 'meikou'

      - name: Install MSVC 14.44 ATL (same as OBS CI)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $argList = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL --quiet --norestart --nocache"
          $proc = Start-Process -FilePath $installer -ArgumentList $argList -Wait -PassThru
          if ($proc.ExitCode -notin 0, 3010) { throw "bad exit code: $($proc.ExitCode)" }
          if (-not (Test-Path -Path "$vsPath\VC\Tools\MSVC\14.44*\atlmfc\include\atlbase.h")) { throw "ATL header not found" }

      - name: Configure
        working-directory: obs-studio
        run: >
          cmake --preset windows-x64
          "-DENABLE_FRONTEND=OFF"
          "-DENABLE_BROWSER=OFF"
          "-DENABLE_SCRIPTING=OFF"
          "-DENABLE_WEBSOCKET=OFF"
          "-DENABLE_AJA=OFF"
          "-DENABLE_VST=OFF"
          "-DENABLE_CCACHE=OFF"
          "-DOBS_VERSION_OVERRIDE=$env:OBS_TAG"
          "-DMEIKOU_VERSION=$env:MEIKOU_VERSION"

      - name: Build
        working-directory: obs-studio
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Package (one-click installer + portable zip)
        run: |
          $rundir = Resolve-Path 'obs-studio/build_x64/rundir/RelWithDebInfo'
          if (-not (Test-Path "$rundir/bin/64bit/meikou-live-studio.exe")) { throw 'meikou-live-studio.exe not found' }
          New-Item -ItemType Directory -Force out | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'meikou-portable'
          robocopy $rundir $stage /E /XF *.pdb *.lib *.exp /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          # 一起附上 Visual C++ 執行階段，沒裝過 VC++ 可轉散發套件的電腦也能直接執行
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'VC runtime not found' }
          Copy-Item "$($crt.FullName)\*.dll" "$stage\bin\64bit\" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "out/MeikouLiveStudio-$env:MEIKOU_VERSION-Windows-x64-portable.zip"
          choco install nsis -y --no-progress
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $outfile = (Join-Path (Resolve-Path out) "MeikouLiveStudio-$env:MEIKOU_VERSION-Windows-x64-Setup.exe")
          & $makensis /V2 "/DVERSION=$env:MEIKOU_VERSION" "/DVIVERSION=$env:MEIKOU_VIVERSION" "/DSRCDIR=$stage" "/DOUTFILE=$outfile" installer/meikou.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed $LASTEXITCODE" }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: out/*
          retention-days: 14

      - name: Self test（自動巡檢）
        continue-on-error: true
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'meikou-portable'
          $st = Join-Path $pwd 'selftest'
          New-Item -ItemType Directory -Force $st | Out-Null
          $sink = Start-Process python -ArgumentList 'tools/rtmp_sink.py','--port','1935','--report',"$st\rtmp_sink.json",'--seconds','400','--connect-delay','2.5' -PassThru -NoNewWindow
          Start-Sleep 2
          $bin = "$stage\bin\64bit"
          $p = Start-Process "$bin\meikou-live-studio.exe" -ArgumentList '--selftest','--report',"$st\report.json",'--shots',"$st",'--rtmp','rtmp://127.0.0.1:1935/live' -WorkingDirectory $bin -PassThru
          if (-not $p.WaitForExit(360000)) { $p.Kill(); Write-Host 'SELFTEST TIMEOUT' }
          Write-Host "selftest exit code: $($p.ExitCode)"
          Start-Sleep 1
          Stop-Process $sink -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\meikou-selftest\logs\*" $st -ErrorAction SilentlyContinue
          if (Test-Path "$st\report.json") { Get-Content "$st\report.json" -Encoding UTF8 } else { Write-Host 'no report' }
          if (Test-Path "$st\rtmp_sink.json") { Get-Content "$st\rtmp_sink.json" -Encoding UTF8 }

      - name: Upload self test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-windows
          path: selftest/*
          retention-days: 14

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    env:
      CODESIGN_IDENT: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: OBS version and changelog heading
        run: |
          echo "OBS_TAG=$(tr -d '[:space:]' < obs-version.txt)" >> "$GITHUB_ENV"
          python3 tools/changelog.py stamp meikou/resources/CHANGELOG.md
      - name: Fetch OBS version tag (git describe needs it)
        run: git -C obs-studio fetch --depth=1 origin "refs/tags/${OBS_TAG}:refs/tags/${OBS_TAG}"

      - name: Select Xcode
        run: |
          local xcode=/Applications/Xcode_26.5.app
          if [[ -d ${xcode} ]] sudo xcode-select --switch ${xcode}/Contents/Developer
          xcodebuild -version

      - name: Restore OBS dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: obs-studio/.deps
          key: obs-deps-macos-arm64-${{ hashFiles('obs-studio/CMakePresets.json', 'obs-studio/buildspec.json') }}

      - name: Hook Meikou into the OBS build
        run: |
          local f=obs-studio/CMakeLists.txt
          if ! grep -q meikou ${f}; then
            perl -0pi -e 's|add_subdirectory\(frontend\)|add_subdirectory(frontend)\nadd_subdirectory("\${CMAKE_CURRENT_SOURCE_DIR}/../meikou" meikou)|' ${f}
          fi
          grep -n meikou ${f}

      - name: Configure
        working-directory: obs-studio
        run: |
          cmake --preset macos \
            -DCMAKE_OSX_ARCHITECTURES:STRING=arm64 \
            -DENABLE_FRONTEND:BOOL=OFF \
            -DENABLE_BROWSER:BOOL=OFF \
            -DENABLE_SCRIPTING:BOOL=OFF \
            -DENABLE_WEBSOCKET:BOOL=OFF \
            -DENABLE_AJA:BOOL=OFF \
            -DENABLE_VST:BOOL=OFF \
            -DENABLE_VIRTUALCAM:BOOL=OFF \
            -DENABLE_SYPHON:BOOL=OFF \
            -DSPARKLE_APPCAST_URL:STRING= \
            -DSPARKLE_PUBLIC_KEY:STRING= \
            -DOBS_VERSION_OVERRIDE:STRING=${OBS_TAG} \
            -DMEIKOU_VERSION:STRING=${MEIKOU_VERSION}

      - name: Build
        working-directory: obs-studio/build_macos
        run: |
          xcodebuild ONLY_ACTIVE_ARCH=NO \
            -project obs-studio.xcodeproj \
            -target obs-studio \
            -destination "generic/platform=macOS,name=Any Mac" \
            -configuration RelWithDebInfo \
            -parallelizeTargets \
            -hideShellScriptEnvironment \
            -quiet \
            build

      - name: Package (.pkg installer + zip)
        run: |
          local app=$(find obs-studio/build_macos/meikou -maxdepth 3 -name '*.app' -type d | head -n 1)
          if [[ -z ${app} ]] { print 'app bundle not found'; find obs-studio/build_macos -maxdepth 4 -name '*.app'; exit 1 }
          print "App: ${app}"
          mkdir -p stage out
          ditto ${app} "stage/Meikou Live Studio.app"
          local bundle="stage/Meikou Live Studio.app"
          echo '[PlugIns]'; ls "${bundle}/Contents/PlugIns" | head -50
          echo '[Frameworks]'; ls "${bundle}/Contents/Frameworks" | head -50
          # 沒有 Apple 開發者憑證，用 ad-hoc 簽章讓 Apple Silicon 可以執行
          codesign --force --deep --sign - --entitlements meikou/cmake/macos/entitlements.plist "${bundle}"
          codesign --verify --deep --strict "${bundle}" && print 'codesign OK'
          # 一鍵安裝的 .pkg：裝到「應用程式」資料夾
          pkgbuild --analyze --root stage component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          pkgbuild --root stage --component-plist component.plist \
            --identifier com.meikou.live-studio --version ${MEIKOU_VERSION%%-*} \
            --install-location /Applications \
            "out/MeikouLiveStudio-${MEIKOU_VERSION}-macOS-AppleSilicon.pkg"
          ditto -c -k --keepParent "${bundle}" "out/MeikouLiveStudio-${MEIKOU_VERSION}-macOS-AppleSilicon.zip"
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: out/*
          retention-days: 14

      - name: Self test（自動巡檢）
        continue-on-error: true
        run: |
          mkdir -p selftest
          python3 tools/rtmp_sink.py --port 1935 --report selftest/rtmp_sink.json --seconds 400 --connect-delay 2.5 &
          local sink=$!
          sleep 2
          local exe=$(find "stage/Meikou Live Studio.app/Contents/MacOS" -type f -perm +111 | head -n 1)
          echo "exe: ${exe}"
          "${exe}" --selftest --report ${PWD}/selftest/report.json --shots ${PWD}/selftest --rtmp rtmp://127.0.0.1:1935/live &
          local pid=$!
          local waited=0
          while kill -0 ${pid} 2>/dev/null && (( waited < 360 )); do sleep 2; (( waited += 2 )); done
          if kill -0 ${pid} 2>/dev/null; then echo 'SELFTEST TIMEOUT'; kill -9 ${pid}; fi
          rc=0; wait ${pid} || rc=$?; echo "selftest exit code: ${rc}"
          sleep 1
          kill ${sink} 2>/dev/null || true
          cp -R "${TMPDIR}meikou-selftest/logs" selftest/ 2>/dev/null || true
          cat selftest/report.json 2>/dev/null || echo 'no report'
          cat selftest/rtmp_sink.json 2>/dev/null || true

      - name: Upload self test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-macos
          path: selftest/*
          retention-days: 14

  gate:
    # 兩個平台都編譯成功、自動巡檢 0 項失敗才算通過（OBS 核心自動更新靠這一關決定能不能發布）
    name: Self-test gate
    needs: [windows, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: selftest-*
          path: selftest
      - name: Check both reports
        env:
          WIN: ${{ needs.windows.result }}
          MAC: ${{ needs.macos.result }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          # 只下載到一個報告時，檔案會直接放在 selftest/ 底下（沒有子資料夾），所以到處找
          ok = os.environ["WIN"] == "success" and os.environ["MAC"] == "success"
          found = {}
          for path in glob.glob("selftest/**/report.json", recursive=True):
              r = json.load(open(path, encoding="utf-8"))
              text = (path + " " + str(r.get("platform", ""))).lower()
              key = "windows" if "windows" in text else "macos"
              found[key] = r
          for key in ("windows", "macos"):
              r = found.get(key)
              if not r:
                  print(f"{key}: no report"); ok = False; continue
              print(f"{key}: {r['passed']} passed, {r['failed']} failed, {r['warnings']} warnings")
              ok = ok and r["failed"] == 0 and r["passed"] > 50
          print("gate:", "pass" if ok else "fail")
          sys.exit(0 if ok else 1)
          PY

  release:
    name: Publish pre-release
    needs: [windows, macos]
    # 只有 main 分支發布；試編分支（例如 OBS 核心更新）只編譯與巡檢
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            tools
            meikou/resources/CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{windows,macos}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: selftest-*
          path: selftest
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/changelog.py stamp meikou/resources/CHANGELOG.md
          ls -la dist
          summary=$(python3 - <<'PY'
          import json, glob, os
          lines = []
          # 報告可能在 selftest/selftest-<平台>/ 或直接在 selftest/（只有一份時）
          where = {}
          for path in glob.glob("selftest/**/report.json", recursive=True):
              plat = str(json.load(open(path, encoding="utf-8")).get("platform", "")).lower()
              where["selftest-windows" if ("windows" in path.lower() or "windows" in plat) else "selftest-macos"] = os.path.dirname(path)
          for name, label in (("selftest-windows", "Windows"), ("selftest-macos", "macOS")):
              try:
                  d = where[name]
                  r = json.load(open(f"{d}/report.json", encoding="utf-8"))
                  s = json.load(open(f"{d}/rtmp_sink.json", encoding="utf-8")) if os.path.exists(f"{d}/rtmp_sink.json") else {}
                  rtmp = f"，RTMP 收到 {s.get('video_packets',0)} 個影像封包／{s.get('audio_packets',0)} 個聲音封包" if s else ""
                  lines.append(f"- {label} 自動巡檢：{r['passed']} 項通過、{r['failed']} 項失敗、{r['warnings']} 項提醒{rtmp}")
              except Exception as e:
                  lines.append(f"- {label} 自動巡檢：沒有報告")
          print("\n".join(lines))
          PY
          )
          # 這一版的更新內容（CHANGELOG.md 裡同版號的段落）
          changes=$(python3 - <<'PY'
          import os, re
          v = os.environ.get("MEIKOU_VERSION", "")
          try:
              text = open("meikou/resources/CHANGELOG.md", encoding="utf-8").read()
          except Exception:
              text = ""
          out = []
          for sec in re.split(r"\n(?=## )", text):
              if sec.startswith("## " + v):
                  out = sec.strip().splitlines()[1:]
          print("\n".join(out) if out else "- 例行更新")
          PY
          )
          notes="## 這一版更新了什麼
          ${changes}

          ## 下載與安裝
          Meikou Live Studio ${MEIKOU_VERSION}（commit ${GITHUB_SHA::7}）
          - Windows：下載 *-Windows-x64-Setup.exe，點兩下就會自動安裝並開啟。zip 為免安裝版。
          - macOS（Apple Silicon M 系列晶片）：下載 *-macOS-AppleSilicon.pkg，點兩下安裝到「應用程式」。
            第一次打開若出現「無法驗證開發者」，到「系統設定 → 隱私權與安全性」按「強制打開」。

          ## 自動巡檢
          ${summary}"
          # 巡檢報告與截圖一起附在 Release（檔名 SelfTest-*.zip）
          for d in selftest/selftest-*; do
            [ -d "$d" ] || continue
            n=$(basename "$d" | sed 's/selftest-//')
            (cd "$d" && zip -qr "../../dist/SelfTest-${n}.zip" .)
          done
          # 只有一份報告時檔案直接在 selftest/ 底下
          if [ -f selftest/report.json ]; then
            if grep -qi '"platform": *"[^"]*windows' selftest/report.json; then n=windows; else n=macos; fi
            (cd selftest && zip -qr "../dist/SelfTest-${n}.zip" . -x 'selftest-*')
          fi
          gh release create "v${MEIKOU_VERSION}" dist/* --prerelease \
            --title "Meikou Live Studio ${MEIKOU_VERSION}" --notes "$notes" --target "${GITHUB_SHA}"
      - name: Write the version number into the changelog
        # 「## 下一版」改成這一版的版號，寫回 main（.md 變更不會觸發編譯）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- meikou/resources/CHANGELOG.md; then
            git add meikou/resources/CHANGELOG.md
            git commit -m "Changelog: ${MEIKOU_VERSION} [skip ci]"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
